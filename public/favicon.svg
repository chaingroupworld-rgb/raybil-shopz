  <!-- Small Shopping Bag on the side -->
  <g transform="translate(48, 42) scale(0.4)">
    <!-- Bag body 3D perspective -->
    <polygon points="12,24 24,18 24,80 12,86" fill="#e55a00"/>
    <rect x="24" y="18" width="56" height="62" rx="4" fill="#0b1b36"/>
    <!-- Gold handle -->
    <path d="M40 18 C40 4 64 4 64 18" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="20" r="3" fill="#f59e0b"/>
    <circle cx="64" cy="20" r="3" fill="#f59e0b"/>
  </g>
</svg>
