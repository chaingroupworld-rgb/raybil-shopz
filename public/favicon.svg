<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#e55a00"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c52"/>
      <stop offset="100%" stop-color="#0b1b36"/>
    </linearGradient>
  </defs>
  <!-- Background circle or rounded box -->
  <rect width="100" height="100" rx="20" fill="#ffffff"/>
  <!-- Main R letter -->
  <path d="M22 16 h28 c16 0 26 8 26 21 c0 11 -7 18 -17 20 l19 27 h-15 l-17 -25 h-10 v25 h-14 z M36 30 v16 h14 c7 0 12 -3 12 -8 c0 -6 -5 -8 -12 -8 z" fill="url(#navyGrad)"/>
